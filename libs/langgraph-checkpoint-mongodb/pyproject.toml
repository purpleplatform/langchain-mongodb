[build-system]
requires = ["hatchling>1.24"]
build-backend = "hatchling.build"

[project]
name = "langgraph-checkpoint-mongodb"
version = "0.4.0"
description = "Library with a MongoDB implementation of LangGraph checkpoint saver."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph-checkpoint>=3.0.0",
    "langchain-mongodb>=0.11.0",
    "pymongo>=4.12,<4.18",
]

[dependency-groups]
dev = [
    "anyio>=4.4.0",
    "langchain-core>=1.2.5",
    "langchain-ollama>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "pytest-asyncio>=0.21.1",
    "pytest>=7.2.1",
    "pytest-mock>=3.11.1",
    "pytest-watch>=4.2.0",
    "pytest-repeat>=0.9.3",
    "syrupy>=4.0.2",
    "pre-commit>=4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["langgraph"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 -vv"
markers = [
    "requires: mark tests as requiring a specific library",
    "compile: mark placeholder test used to compile integration tests without running them",
    "asyncio: mark a test as asyncio",
]
asyncio_mode = "auto"

[tool.ruff]
lint.select = [
  "E",  # pycodestyle
  "F",  # Pyflakes
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "I",  # isort
]
lint.ignore = ["E501", "B008", "UP007", "UP006", "UP045"]

[tool.mypy]
# https://mypy.readthedocs.io/en/stable/config_file.html
disallow_untyped_defs = true
explicit_package_bases = true
warn_no_return = false
warn_unused_ignores = true
warn_redundant_casts = true
allow_redefinition = true
disable_error_code = "typeddict-item, return-value"

[tool.uv.sources]
# chunking support lives in the in-repo langchain-mongodb (first-party, not yet
# published to PyPI), and saver.py/base.py import langchain_mongodb.chunking.
# Consume the local editable package so standalone builds/tests resolve it.
langchain-mongodb = { path = "../langchain-mongodb", editable = true }

[tool.uv]
# Vanta vulnerability remediation: security floors for transitive deps.
constraint-dependencies = [
    # numpy 1.26.0 has no cp313 wheel and fails to build from source under
    # --resolution=lowest-direct; 2.1.0 is the first with cp310-cp313 wheels.
    "numpy>=2.1.0",
    # langchain is pulled transitively via the published langchain-mongodb; floor
    # it to the path-traversal fix (GHSA-gr75-jv2w-4656, langchain 1.3.9).
    "langchain>=1.3.9",
    "langchain-core>=1.2.22",
    # mypy 2.x pulls ast-serialize, whose 0.6.0 only ships a cp314 wheel (no
    # sdist), so it can't install on 3.10-3.13. Pin below it; 0.1.x-0.2.x ship
    # cp39-abi3 wheels covering all supported versions. Needed for the CI
    # "minimum dependency versions" (--resolution=lowest-direct) step.
    "ast-serialize<0.6.0",
    "aiohttp>=3.14.1",
    "filelock>=3.20.0",
    "idna>=3.18",
    "langsmith>=0.6.0",
    "marshmallow>=3.26.2",
    "orjson>=3.11.6",
    "pip>=26.1",
    "pygments>=2.20.0",
    "pypdf>=6.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]
