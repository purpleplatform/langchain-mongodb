
[build-system]
requires = ["hatchling>1.24"]
build-backend = "hatchling.build"

[project]
name = "langchain-mongodb"
version = "0.11.0"
description = "An integration package connecting MongoDB and LangChain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.2.5",
    "langchain>=1.0",
    "langchain-classic>=1.0",
    "pymongo>=4.6.1",
    "langchain-text-splitters>=1.0",
    "numpy>=1.26",
    "lark<2.0.0,>=1.1.9",
    "pymongo-search-utils>=0.3.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.2.2",
    "langchain>=1.0",
    "langchain-core>=1.2.5",
    "langchain-text-splitters>=1.0",
    "pytest-mock>=3.10.0",
    "pytest>=7.3.0",
    "syrupy>=4.0.2",
    "pytest-watcher>=0.3.4",
    "pytest-asyncio>=0.21.1",
    "pre-commit>=4.0",
    "mypy>=1.10",
    "simsimd>=6.5.0",
    "langchain-ollama>=1.0",
    "langchain-openai>=1.0",
    "langchain-community>=0.3.27",
    "pypdf>=5.0.1",
    "langgraph>=1.0.0",
    "flaky>=3.8.1",
    "langchain-tests==1.1.9",
    "pip>=25.0.1",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
viz = [
    "networkx>=3.0",
    "holoviews>=1.19",
]

[tool.pytest.ini_options]
minversion = "7"
addopts = "--snapshot-warn-unused --strict-markers --strict-config --durations=5"
log_cli_level = "INFO"
faulthandler_timeout = 1500
xfail_strict = true
markers = [
    "requires: mark tests as requiring a specific library",
    "compile: mark placeholder test used to compile integration tests without running them",
    "viz: marks tests as requiring optional-dependency group `viz`",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Ignore ResourceWarning raised by langchain standardized base classes.
    "ignore:unclosed <socket.socket:ResourceWarning",
    # Suppress pending deprecation from langchain-core loads() raised by upstream packages.
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
    # langchain-community >=0.4.2 emits a "being sunset" DeprecationWarning at import;
    # it is informational and the package still works. Ignore so the integration
    # conftest (which imports langchain_community) does not fail under -W error.
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]

[tool.mypy]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["no-untyped-def", "no-untyped-call", "var-annotated"]

[tool.ruff]
lint.select = [
  "E",  # pycodestyle
  "F",  # Pyflakes
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "I",  # isort
]
lint.ignore = ["E501", "B008", "UP007", "UP006", "UP035", "UP045"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.uv]
# Vanta vulnerability remediation: security floors for transitive deps.
# requires-python is >=3.10, so the py3.10-gated upstream fixes are taken
# (aiohttp 3.14.x, urllib3 2.7.0, langsmith 0.6+, requests 2.33+, filelock 3.20+,
# idna 3.18, langchain 1.3.9 path-traversal fix, orjson, python-dotenv, pip 26).
# Most are already satisfied by current upstream; these floors keep them pinned
# at or above the patched versions even under --resolution=lowest-direct.
constraint-dependencies = [
    # numpy 1.26.0 has no cp313 wheel and fails to build from source under
    # --resolution=lowest-direct; 2.1.0 is the first with cp310-cp313 wheels.
    "numpy>=2.1.0",
    # mypy 2.x pulls ast-serialize, whose 0.6.0 only ships a cp314 wheel (no
    # sdist), so it can't install on 3.10-3.13. Pin below it; 0.1.x-0.2.x ship
    # cp39-abi3 wheels covering all supported versions. Needed for the CI
    # "minimum dependency versions" (--resolution=lowest-direct) step.
    "ast-serialize<0.6.0",
    "aiohttp>=3.14.1",
    "filelock>=3.20.0",
    "idna>=3.18",
    "langsmith>=0.6.0",
    "marshmallow>=3.26.2",
    "orjson>=3.11.6",
    "pip>=26.1",
    "pygments>=2.20.0",
    "pypdf>=6.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]
